name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/resources/version.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version v$version"
          }

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r desktop/requirements.txt pyinstaller

      - name: Download FFmpeg runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $ffmpeg = Get-ChildItem $expanded -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg executable was not found in the downloaded archive." }
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          Copy-Item -Path (Join-Path $ffmpeg.Directory.FullName "*") -Destination bin -Recurse -Force

      - name: Build portable application
        shell: pwsh
        run: ./desktop/build_portable.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/TuyennnToolbox-win64.zip" `
            "dist/TuyennnToolbox-win64.zip.sha256" `
            --title "Tuyennn Toolbox ${{ github.ref_name }}" `
            --generate-notes
